name: gate
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    # Local, not PONOdata/gatekeeper. This repo is public and gatekeeper is
    # private, and GitHub does not let a public repo call a private repo's
    # reusable workflow. The old caller failed at load with no jobs and no
    # check runs, so the seven required gate contexts never reported and every
    # PR here was unmergeable with nothing to point at. The org's other three
    # public repos already carry a local copy for the same reason.
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner_labels: '["ubuntu-latest"]'
      # This repo is the org profile: profile/README.md and two workflows.
      # There is no code to lint, no types to check, nothing to test and
      # nothing to build, so all four are declared rather than left blank.
      # Under the old behaviour a blank command reported success, which made
      # four required checks look like verification of a repo that has
      # nothing to verify.
      unconfigured_ok: "lint,typecheck,test,build"
      run_semgrep: true
      # The one that carries weight here: profile/README.md is the first
      # thing anyone sees of the org.
      run_tell_check: true
      run_dependency_review: false
